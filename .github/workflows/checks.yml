# =========================================================================
# Правовой консультант :: проверки кода и данных
# -------------------------------------------------------------------------
# Прогоняет три проверки перед тем, как изменения попадут на сайт:
#   1. node tools/audit.js       — сплошной аудит данных (потери статей, глав);
#   2. node tools/verify-data.js — согласованность данных и кода (ссылки,
#      шаблоны, иски, сроки, защита разметки, гварды на текст app.js);
#   3. node tools/smoke-test.js  — живой прогон интерфейса (jsdom);
#   4. node proxy/test/smoke.js  — разбор ответа и защита прокси (mock-режим).
#
# Почему отдельная задача, а не шаг внутри «Публикации»: проверки были
# только в ночной сборке, а обычный push в main их не запускал вовсе —
# регрессия в коде доходила до сайта молча. Теперь «Публикация» вызывает
# эту задачу и не выкладывает сайт, если проверки красные.
#
# Каталог vendor/ (сырые выгрузки источников) в git не хранится, поэтому
# сверка с первоисточником (разделы 3–4 проверки данных, A и G аудита)
# здесь пропускается — она выполняется в ночной сборке, где выгрузки
# скачиваются заново. Остальные проверки от выгрузок не зависят.
#
# Запуск вручную: вкладка Actions → «Проверки» → Run workflow.
# =========================================================================
name: Проверки

on:
  workflow_dispatch:
  # Вызов из «Публикации»: та зовёт эту задачу перед выкладкой.
  # Флаг skip_checks выставлен в «Обновлении базы» — там проверки уже
  # прогонялись до коммита, второй раз они не нужны.
  workflow_call:
    inputs:
      skip_checks:
        description: "Не запускать проверки (они уже прогонялись)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  check:
    # Явная 24.04 вместо ubuntu-latest: с 19.10.2026 метка latest переезжает
    # на Ubuntu 26.04 (объявлено как breaking change — другой systemd, ядро,
    # Docker). Фиксируем проверенный образ.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v7

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # jsdom нужен дымовому тесту: без него интерфейс не проверить.
      - name: Зависимости для проверок
        run: npm ci

      # `set -o pipefail` обязателен: без него код возврата берётся у `tee`
      # (всегда 0), и красная проверка не остановила бы выкладку.
      - name: Аудит данных
        run: |
          set -o pipefail
          node tools/audit.js | tee audit.log

      - name: Сверка данных
        run: |
          set -o pipefail
          node tools/verify-data.js | tee verify.log

      - name: Прогон интерфейса
        run: |
          set -o pipefail
          node tools/smoke-test.js | tee smoke.log

      # Прокси не входит в сборку сайта, но его разбор ответа и защита
      # ломаются так же незаметно. Секреты не нужны: тест идёт в mock-режиме.
      - name: Проверки прокси
        run: |
          set -o pipefail
          node proxy/test/smoke.js | tee proxy.log

      - name: Логи прогона
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checks-logs
          path: |
            audit.log
            verify.log
            smoke.log
            proxy.log
          retention-days: 14
          if-no-files-found: ignore
