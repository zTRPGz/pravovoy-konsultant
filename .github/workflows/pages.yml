# =========================================================================
# Правовой консультант :: публикация на GitHub Pages
# -------------------------------------------------------------------------
# На каждый push в main собирает каталог публикации dist/ и выкладывает его
# на GitHub Pages. Коммиты ночной сборки («Обновление базы») push-триггер не
# активируют: они уходят через GITHUB_TOKEN, а pushes от GITHUB_TOKEN новые
# workflow-запуски не создают. Поэтому ночная сборка вызывает эту задачу
# явно (workflow_call) и передаёт новый коммит в ref.
#
# Почему GitHub Pages, а не Vercel или Cloudflare Pages: из России без VPN
# ни один из них не открывается (замер: *.vercel.app и pages.dev не
# отвечают вовсе, github.io работает). Подробности — DEPLOY.md, §1 и §2.3.
#
# Что сделать один раз вручную: Settings → Pages → Build and deployment →
# Source: GitHub Actions. Без этого задача упадёт на шаге «Настройка Pages».
#
# Запуск вручную: вкладка Actions → «Публикация» → Run workflow.
# =========================================================================
name: Публикация

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Вызов из «Обновление базы» после коммита свежих данных: ref — какой
  # коммит выкладывать (у вызывателя свой GITHUB_SHA, поэтому передаём явно).
  workflow_call:
    inputs:
      ref:
        description: "Коммит или ветка для выкладки (по умолчанию — коммит запуска)"
        type: string
        required: false

# Права: выкладка в Pages идёт через OIDC-токен, содержимое нужно только
# на чтение — этот workflow ничего не коммитит.
permissions:
  contents: read
  pages: write
  id-token: write

# Одновременно — только одна выкладка. Идущую до конца не отменяем:
# прерванный деплой оставил бы сайт в промежуточном состоянии.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Явная 24.04 вместо ubuntu-latest: с 19.10.2026 метка latest переезжает
    # на Ubuntu 26.04 (объявлено как breaking change — другой systemd, ядро,
    # Docker). Переезд идёт волной до 19.11.2026, то есть день выкладки заранее
    # неизвестен. Фиксируем проверенную версию; на 26.04 перейдём отдельно,
    # прогнав сборку и проверки на нём.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Получение репозитория
        uses: actions/checkout@v7
        with:
          # При push/workflow_dispatch выкладываем коммит запуска; при вызове
          # из ночной сборки — переданный ею новый коммит с данными.
          ref: ${{ inputs.ref || github.sha }}

      - name: Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Собирается только то, что нужно посетителю: index.html, app.js,
      # styles.css, favicon.svg и data/. Отдавать корень нельзя — tools/,
      # .github/ и package.json стали бы доступны по прямым ссылкам.
      - name: Сборка каталога публикации
        run: node tools/build-dist.js

      - name: Настройка Pages
        uses: actions/configure-pages@v6

      - name: Загрузка каталога
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Выкладка
        id: deployment
        uses: actions/deploy-pages@v5
